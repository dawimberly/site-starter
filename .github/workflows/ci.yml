name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: find . -not -path './.git/*' -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
      - run: npm run build
      - run: npm run check:example
      - run: npm test
